security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|build|assets)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\AppAuthenticator

            logout:
                path: app_logout
                target: app_login

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        # Pages publiques
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/register$, roles: PUBLIC_ACCESS }

        # Administration
        - { path: ^/admin, roles: ROLE_ADMIN }

        # Espace utilisateur
        - { path: ^/journal, roles: ROLE_USER }
        - { path: ^/goal, roles: ROLE_USER }
        - { path: ^/history, roles: ROLE_USER }
        - { path: ^/export, roles: ROLE_USER }
        - { path: ^/choisir-coach, roles: ROLE_USER }

        # Espace coach
        - { path: ^/coach, roles: ROLE_COACH }

        # Espace commun
        - { path: ^/dashboard, roles: [ROLE_USER, ROLE_COACH] }
        - { path: ^/profile, roles: [ROLE_USER, ROLE_COACH] }
        - { path: ^/messages, roles: [ROLE_USER, ROLE_COACH] }
        - { path: ^/notifications, roles: [ROLE_USER, ROLE_COACH] }
        - { path: ^/sessions, roles: [ROLE_USER, ROLE_COACH] }
        - { path: ^/feedback, roles: [ROLE_USER, ROLE_COACH] }