security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_COACH: ROLE_USER
        ROLE_ADMIN: [ROLE_USER, ROLE_COACH]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|build|assets)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\AppAuthenticator

            logout:
                path: app_logout
                target: app_home

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        # Pages publiques
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/register$, roles: PUBLIC_ACCESS }
        - { path: ^/register/coach$, roles: PUBLIC_ACCESS }
        - { path: ^/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/(conditions-utilisation|politique-confidentialite)$, roles: PUBLIC_ACCESS }

        # Administration
        - { path: ^/admin, roles: ROLE_ADMIN }

        # Espace coach uniquement
        - { path: ^/coach, roles: ROLE_COACH }

        # Espace utilisateur uniquement
        - { path: ^/journal, roles: ROLE_USER }
        - { path: ^/cible$, roles: ROLE_USER }
        - { path: ^/goal, roles: ROLE_USER }
        - { path: ^/history, roles: ROLE_USER }
        - { path: ^/export, roles: ROLE_USER }
        - { path: ^/choisir-coach, roles: ROLE_USER }

        # Espace commun (ROLE_USER suffit grâce à role_hierarchy)
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/bienvenue/questionnaire$, roles: ROLE_USER }
        - { path: ^/profile, roles: ROLE_USER }
        - { path: ^/accessibility$, roles: ROLE_USER }
        - { path: ^/messages, roles: ROLE_USER }
        - { path: ^/notifications, roles: ROLE_USER }
        - { path: ^/sessions, roles: ROLE_USER }
        - { path: ^/feedback, roles: ROLE_USER }
